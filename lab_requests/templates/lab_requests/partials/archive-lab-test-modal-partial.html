<dialog id="archive_lab_test_modal" class="bg-transparent">
  <div class="modal-box p-10 w-full lg:min-w-[480px]">
    {% if test %}
      <form hx-post="document.getElementById('{% url 'lab_requests:archive_lab_test' test.id %}"
            hx-target="#tests-configuration-test-{{ test.id }}"
            hx-swap="outerHTML">
        {% csrf_token %}
        <h3 class="font-bold text-lg mb-4">Archive {{ test.name }}?</h3>
        <p class="label text-xs">
          This action will not delete the test off the database, it will deactivate the test, and disallow staff from performing any actions on it.
        </p>
        <div class="flex items-center gap-2 w-full">
          <button type="document.getElementById('button"
                  class="btn btn-neutral text-white flex-1"
                  onclick="archive_lab_test_modal').close();">Cancel</button>
          <button type="submit" class="btn btn-error text-white flex-1">Archive</button>
        </div>
      </form>
    {% endif %}
  </div>
</dialog>
