<dialog id="export_revenue_reports_modal" class="bg-transparent w-5xl">
    <div class="modal-box p-10 w-full lg:min-w-[480px]">
        <h3 class="font-bold text-lg mb-8">Export Revenue Reports</h3>
        <div class="w-full flex gap-2 items-center justify-stretch mb-4">
            <button class="btn btn-neutral text-white flex gap-2"
                    hx-get="{% url 'staff:admin_revenue_reports_export' %}?fmt=excel"
                    hx-include="#revenue-reports-filters"
                    hx-on::after-request="document.getElementById('export_revenue_reports_modal').close();">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="24"
                     height="24"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     class="lucide lucide-sheet-icon lucide-sheet">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2" /><line x1="3" x2="21" y1="9" y2="9" /><line x1="3" x2="21" y1="15" y2="15" /><line x1="9" x2="9" y1="9" y2="21" /><line x1="15" x2="15" y1="9" y2="21" />
                </svg>
                Excel
            </button>
            <button class="btn btn-neutral text-white flex gap-2"
                    hx-get="{% url 'staff:admin_revenue_reports_export' %}?fmt=pdf"
                    hx-include="#revenue-reports-filters"
                    hx-on::after-request="document.getElementById('export_revenue_reports_modal').close();">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="24"
                     height="24"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     class="lucide lucide-file-text-icon lucide-file-text">
                    <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
                    <path d="M14 2v5a1 1 0 0 0 1 1h5" />
                    <path d="M10 9H8" />
                    <path d="M16 13H8" />
                    <path d="M16 17H8" />
                </svg>
                PDF
            </button>
        </div>
        <button class="btn btn-error text-white w-full"
                onclick="document.getElementById('export_revenue_reports_modal').close();">Cancel</button>
    </div>
</dialog>
