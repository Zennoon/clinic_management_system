{% if patient and patient_treatment_requests %}
    <div class="bg-white border border-gray-300 rounded-xl p-8 shadow-lg space-y-4">
        <div class="flex flex-col gap-4">
            <h3 class="text-xl font-semibold">Treatment Requests</h3>
            <div class="flex flex-col md:flex-row justify-between items-center overflow-x-auto whitespace-nowrap gap-4"
                 id="patient-treatment-requests-filters">
                <div class="flex flex-col md:flex-row justify-between items-center gap-2 md:gap-4">
                    <div class="flex items-center gap-2">
                        <input class="toggle toggle-sm"
                               hx-get="{% url 'staff:reception_patient_charges_filter' patient.id %}"
                               hx-include="#patient-charges-table-filters"
                               hx-target="#patient-charges-table-container"
                               id="show_archived_charges"
                               name="show_archived"
                               type="checkbox" />
                        <label for="show_archived_charges">Show archived requests</label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input class="toggle toggle-sm"
                               hx-get="{% url 'staff:reception_patient_charges_filter' patient.id %}"
                               hx-include="#patient-charges-table-filters"
                               hx-target="#patient-charges-table-container"
                               id="show_archived_charges"
                               name="show_archived"
                               type="checkbox" />
                        <label for="show_archived_charges">Show requests awaiting payment</label>
                    </div>
                </div>
                <label for="sort" class="sr-only">Sort by</label>
                <select class="select select-bordered"
                        hx-get="{% url 'staff:reception_patient_charges_filter' patient.id %}"
                        hx-include="#patient-charges-table-filters"
                        hx-target="#patient-charges-table-container"
                        id="sort"
                        name="sort">
                    <option disabled="" selected="" value="">Sort by</option>
                    {% for key, val in charge_order_options.items %}
                        <option class="flex gap-2 items-center text-black" value="{{ key }}">
                            Ascending
                            {{ val }}
                        </option>
                        <option class="flex gap-2 items-center" value="-{{ key }}">
                            Descending
                            <svg class="lucide lucide-chevron-down-icon lucide-chevron-down"
                                 fill="none"
                                 height="24"
                                 stroke="currentColor"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 stroke-width="2"
                                 viewbox="0 0 24 24"
                                 width="24"
                                 xmlns="http://www.w3.org/2000/svg">
                                <path d="m6 9 6 6 6-6"></path>
                            </svg>
                            {{ val }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            {% include "staff/nurse/patients/partials/patient-treatment-requests-table-partial.html" %}
        </div>
    </div>
{% endif %}
