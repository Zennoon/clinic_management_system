<div class="hidden sm:flex items-center gap-2 px-3 py-1 bg-gray-50 dark:bg-base-200 rounded-md border border-gray-100 dark:border-base-300"
     hx-get="{% url 'now' %}"
     hx-trigger="every 60s"
     hx-swap="outerHTML">
  <div class="p-1.5 bg-indigo-50 text-indigo-600 rounded-md">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
  </div>
  <div class="flex flex-col text-left leading-none gap-0.5">
    
    {% if now %}
        <span class="text-sm font-semibold text-gray-800">{{ now|date:"M d, Y" }}</span>
        <span class="text-[11px] font-mono text-gray-700">{{ now|time:"H:i" }}</span>
    {% else %}
        <span class="text-sm font-semibold text-gray-800">{% now "M d, Y" %}</span>
        <span class="text-[11px] font-mono text-gray-700">{% now "H:i" %}</span>        
    {% endif %}
        
  </div>
</div>
