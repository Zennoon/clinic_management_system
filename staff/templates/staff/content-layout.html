{% extends "base.html" %}
{% load static %}
{% block content %}
  <div class="h-full w-full">
    <div class="flex h-screen w-full">
      <nav id="sidebar" class="z-40 flex h-full w-24 flex-col border-r border-gray-200 bg-white p-4 md:data-[state=open]:w-64 shrink-0 overflow-y-auto transition-all duration-300 group" data-state="closed"
           aria-label="sidebar navigation">
        <a href="{% url 'index' %}" class="mb-10 flex justify-start items-center">
          <img src="{% static 'images/logo.png' %}"
               alt="Logo"
               class="w-14"
               width="56"
               height="auto" />
            
        </a>
        <div class="h-full flex flex-col gap-2 overflow-hidden">
          {% block sidebar_links %}
          {% endblock sidebar_links %}
        </div>
      </nav>
      <div class="flex flex-1 flex-col min-w-0">
        <header class="h-16 w-full shrink-0 border-b bg-white px-8 flex justify-between items-center shadow-sm z-40">
          <div id="sidebar-drawer-toggle"
              title="Expand sidebar"
               class="hover:text-indigo-600 transform transition-all">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="24"
                 height="24"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 class="lucide lucide-panel-left-open-icon lucide-panel-left-open hover:text-indigo-500">
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M9 3v18" />
              <path d="m14 9 3 3-3 3" />
            </svg>
          </div>
          <div class="dropdown dropdown-end">
            <div tabindex="0"
                 role="button"
                 class="flex items-center p-2 rounded-md gap-3 hover:bg-gray-100 transition-colors">
              <span class="flex justify-center items-center rounded-full w-10 h-10 bg-indigo-600 text-white font-bold text-lg">{{ user.username|slice:':1'|upper }}</span>
              <div class="hidden sm:flex flex-col text-left">
                <span class="font-semibold text-sm leading-tight">{{ user.username }}</span>
                <span class="text-xs text-gray-500">{{ user.role|title }}</span>
              </div>
            </div>
            <ul tabindex="0"
                class="menu menu-sm dropdown-content bg-base-100 rounded-box z-60 mt-3 w-52 p-2 shadow-xl border">
              <li>
                <a>Profile</a>
              </li>
              <li>
                <a href="{% url 'staff:attempt_logout' %}">Logout</a>
              </li>
            </ul>
          </div>
        </header>
        <main class="flex-1 overflow-auto bg-gray-50 p-6 sm:p-10" hx-history-elt>
          <div id="main_content"
               class="animate-swap"
               hx-swap="innerHTML swap:200ms settle:200ms">
            {% block main_content %}
            {% endblock main_content %}
          </div>
        </main>
      </div>
    </div>
  </div>
{% endblock content %}
