<title>Visit Logs | {{ user.role.label }} Interface | {{ app_title }}</title>
<div class="flex flex-col gap-4">
  <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
    <h2 class="text-2xl font-semibold">Visits</h2>
    <button class="btn flex gap-2 items-center bg-indigo-600 text-white hover:bg-indigo-500"
            hx-get="{% url 'visits:new_visit_modal' %}?template={{ 'staff/reception/visits/partials/visits-table-row-partial.html'|urlencode }}&amp;target={{ 'visits-table-body'|urlencode }}&amp;swap=afterbegin"
            hx-swap="outerHTML"
            hx-target="#new_visit_modal">
      <svg class="lucide lucide-plus-icon lucide-plus"
           fill="none"
           height="24"
           stroke="currentColor"
           stroke-linecap="round"
           stroke-linejoin="round"
           stroke-width="2"
           viewbox="0 0 24 24"
           width="24"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12h14"></path>
        <path d="M12 5v14"></path>
      </svg>
      New Visit
    </button>
  </div>
  <div class="flex flex-col gap-4 bg-white border border-gray-300 rounded-xl p-6 shadow-lg">
    <div class="space-y-6" id="visits-table-filters">
      <div class="flex flex-col md:flex-row justify-between items-center gap-2">
        <label class="input input-bordered flex items-center gap-2">
          <svg class="h-[1em] opacity-50"
               viewbox="0 0 24 24"
               xmlns="http://www.w3.org/2000/svg">
            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
            </g>
          </svg>
          <input hx-get="{% url 'staff:reception_visits_filter' %}"
                 hx-include="#visits-table-filters"
                 hx-target="#visits-table-container"
                 hx-trigger="keyup delay:500ms"
                 id="q"
                 name="q"
                 placeholder="Search for visit"
                 type="search"
                 value="{{ request.GET.q|default:'' }}" />
        </label>
        <div class="flex flex-col md:flex-row items-center gap-2">
          <label for="category" class="sr-only">Select a category</label>
          <select class="select select-bordered"
                  hx-get="{% url 'staff:reception_visits_filter' %}"
                  hx-include="#visits-table-filters"
                  hx-target="#visits-table-container"
                  id="category"
                  name="category">
            <option value=""
                    disabled
                    {% if not request.GET.category %}selected{% endif %}>Select a category</option>
            <option value="">All</option>
            {% for category in visit_categories %}
              <option value="{{ category|first }}"
                      {% if request.GET.category == category|first %}selected{% endif %}>{{ category|last }}</option>
            {% endfor %}
          </select>
          <label for="status" class="sr-only">Select a status</label>
          <select class="select select-bordered"
                  hx-get="{% url 'staff:reception_visits_filter' %}"
                  hx-include="#visits-table-filters"
                  hx-target="#visits-table-container"
                  id="status"
                  name="status">
            <option value="" disabled {% if not request.GET.status %}selected{% endif %}>Select a status</option>
            <option value="">All</option>
            {% for status in visit_statuses %}
              <option value="{{ status|first }}"
                      {% if request.GET.status == status|first %}selected{% endif %}>{{ status|last }}</option>
            {% endfor %}
          </select>
          <label for="sort" class="sr-only">Sort by</label>
          <select class="select select-bordered"
                  hx-get="{% url 'staff:reception_visits_filter' %}"
                  hx-include="#visits-table-filters"
                  hx-target="#visits-table-container"
                  id="sort"
                  name="sort">
            <option disabled="" selected="" value="">Sort by</option>
            {% for key, val in order_options.items %}
              <option value="{{ key }}"
                      {% if request.GET.sort == key %}selected{% endif %}
                      class="flex gap-2 items-center text-black">Ascending {{ val }}</option>
              <option value="-{{ key }}"
                      {% if request.GET.sort == '-'|add:key %}selected{% endif %}
                      class="flex gap-2 items-center">
                Descending
                <svg class="lucide lucide-chevron-down-icon lucide-chevron-down"
                     fill="none"
                     height="24"
                     stroke="currentColor"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     stroke-width="2"
                     viewbox="0 0 24 24"
                     width="24"
                     xmlns="http://www.w3.org/2000/svg">
                  <path d="m6 9 6 6 6-6"></path>
                </svg>
                {{ val }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-6">
          <div class="flex items-center gap-2">
            <input type="checkbox"
                   id="include_past"
                   name="include_past"
                   {% if request.GET.include_past %}checked{% endif %}
                   class="toggle toggle-sm"
                   hx-get="{% url 'staff:reception_visits_filter' %}"
                   hx-include="#visits-table-filters"
                   hx-target="#visits-table-container" />
            <div class="tooltip" data-tip="Include visits from earlier dates">
              <label for="include_past">Include past visits</label>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox"
                   id="hide_inactive"
                   name="hide_inactive"
                   {% if request.GET.hide_inactive %}checked{% endif %}
                   class="toggle toggle-sm"
                   hx-get="{% url 'staff:reception_visits_filter' %}"
                   hx-include="#visits-table-filters"
                   hx-target="#visits-table-container" />
            <div class="tooltip"
                 data-tip="Hide completed, cancelled, and stale visits">
              <label for="hide_inactive">Hide non-active visits</label>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox"
                   id="show_archived"
                   name="show_archived"
                   {% if request.GET.show_archived %}checked{% endif %}
                   class="toggle toggle-sm"
                   hx-get="{% url 'staff:reception_visits_filter' %}"
                   hx-include="#visits-table-filters"
                   hx-target="#visits-table-container" />
            <label for="show_archived">Show archived visits</label>
          </div>
        </div>
      </div>
    </div>
    {% include "staff/reception/visits/partials/visits-table-partial.html" %}
  </div>
</div>
<div hx-swap-oob="true" id="page_modals_oob_container">
  {% include "visits/partials/update-visit-modal-partial.html" %}
  {% include "charges/partials/new-visit-charge-modal-partial.html" %}
</div>
