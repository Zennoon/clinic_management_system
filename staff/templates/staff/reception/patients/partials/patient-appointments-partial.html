{% load humanize %}
{% if patient %}
  <div class="bg-white border border-gray-300 rounded-xl p-8 shadow-lg space-y-4">
    <div class="flex flex-col gap-4">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-2">
        <h3 class="text-xl">Appointments</h3>
        <div {% if not is_operational %}class="tooltip" data-tip="Patient is archived"{% endif %}>
          <button class="btn flex gap-2 items-center bg-indigo-600 text-white hover:bg-indigo-500"
                  {% if is_operational %} hx-get="{% url 'appointments:new_patient_appointment_modal' patient.id %}" hx-vals='{ "next_url": "{% url "staff:reception_patient_appointments_table_row" "__ID__" %}", "next_target": "patient-appointments-table-body", "next_swap": "afterbegin" }' hx-swap="outerHTML" hx-target="#new_patient_appointment_modal" {% else %} disabled {% endif %}>
            <svg class="lucide lucide-plus-icon lucide-plus"
                 fill="none"
                 height="24"
                 stroke="currentColor"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 stroke-width="2"
                 viewbox="0 0 24 24"
                 width="24"
                 xmlns="http://www.w3.org/2000/svg">
              <path d="M5 12h14"></path>
              <path d="M12 5v14"></path>
            </svg>
            New Appointment
          </button>
        </div>
      </div>
      <div class="flex flex-col md:flex-row justify-between items-center overflow-x-auto whitespace-nowrap gap-6"
           id="patient-appointments-table-filters">
        <div class="flex flex-col md:flex-row items-center gap-2 md:gap-4">
          <div class="flex items-center gap-2">
            <input class="toggle toggle-sm"
                   hx-get="{% url 'staff:reception_patient_appointments_filter' patient.id %}"
                   hx-include="#patient-appointments-table-filters"
                   hx-target="#patient-appointments-table-container"
                   id="show_inactive"
                   name="show_inactive"
                   type="checkbox" />
            <div class="tooltip"
                 data-tip="Show completed, cancelled, and stale appointments">
              <label for="show_inactive">Show non-active appointments</label>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <input class="toggle toggle-sm"
                   hx-get="{% url 'staff:reception_patient_appointments_filter' patient.id %}"
                   hx-include="#patient-appointments-table-filters"
                   hx-target="#patient-appointments-table-container"
                   id="show_archived_appointments"
                   name="show_archived"
                   type="checkbox" />
            <label for="show_archived">Show archived appointments</label>
          </div>
        </div>
        <label for="sort" class="sr-only">Sort by</label>
        <select class="select select-bordered"
                hx-get="{% url 'staff:reception_patient_appointments_filter' patient.id %}"
                hx-include="#patient-appointments-table-filters"
                hx-target="#patient-appointments-table-container"
                id="sort"
                name="sort">
          <option disabled="" selected="" value="">Sort by</option>
          {% for key, val in appointment_order_options.items %}
            <option class="flex gap-2 items-center text-black" value="{{ key }}">
              Ascending
              {{ val }}
            </option>
            <option class="flex gap-2 items-center" value="-{{ key }}">
              Descending
              <svg class="lucide lucide-chevron-down-icon lucide-chevron-down"
                   fill="none"
                   height="24"
                   stroke="currentColor"
                   stroke-linecap="round"
                   stroke-linejoin="round"
                   stroke-width="2"
                   viewbox="0 0 24 24"
                   width="24"
                   xmlns="http://www.w3.org/2000/svg">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
              {{ val }}
            </option>
          {% endfor %}
        </select>
      </div>
    </div>
    {% include "staff/reception/patients/partials/patient-appointments-table-partial.html" %}
  </div>
{% endif %}
