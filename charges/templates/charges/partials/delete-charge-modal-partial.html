<dialog id="delete_charge_modal" class="bg-transparent">
    <div class="modal-box p-10 w-full lg:min-w-[480px]">
        {% if charge %}
            <form hx-post="{% url 'charges:delete_charge' charge.id %}"
                  hx-target="#charges-table-body">
                {% csrf_token %}
                <h3 class="font-bold text-lg mb-4">
                    Archive Charge {{ charge.id }} of {{ charge.visit.patient.fullname }} at {{ charge.date|date:"M d, Y" }}?
                </h3>
                <p class="label text-xs">
                    This action will not delete the charge off the database, it will deactivate the charge, and disallow staff from performing any actions on it.
                </p>
                <div class="flex items-center gap-2 w-full">
                    <button type="button"
                            class="btn btn-neutral text-white flex-1"
                            onclick="document.getElementById('delete_charge_modal').close();">Cancel</button>
                    <button type="submit" class="btn btn-error text-white flex-1">Archive</button>
                </div>
            </form>
        {% endif %}
    </div>
</dialog>
