{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %} | Clinic Management System</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.22/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }

        /* Smooth animation base */
        #main_content {
            transition: 
                opacity 0.25s ease,
                transform 0.25s ease;
            will-change: opacity, transform;
        }

        /* While request is in-flight (slight dim) */
        #main_content.htmx-request {
            opacity: 0.6;
        }

        /* Animate old content out */
        #main_content.htmx-swapping {
            opacity: 0;
            transform: translateY(6px) scale(0.98);
        }

        /* New content initial state */
        #main_content.htmx-settling {
            opacity: 0;
            transform: translateY(-6px) scale(0.98);
        }

        /* Final visible state */
        #main_content.htmx-settled {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    </style>
    
    {% block imports %}
        
    {% endblock imports %}
        
</head>
<body class="h-full w-full bg-gray-50">
    {% block content %}{% endblock content %}
    {% block scripts %}{% endblock scripts %}
</body>
</html>
