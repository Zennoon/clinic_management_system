<dialog id="restore_visit_modal" class="bg-transparent w-4xl">
    <div class="modal-box p-10 w-full">
        {% if visit %}
            <form
                hx-post="{% url 'visits:restore_visit' visit.id %}"
                hx-target="#visits-table-body"
                hx-on:restore-visit-success="restore_visit_modal.close(); this.reset(); alert('Visit activated successfully!');"
            >
                {% csrf_token %}
                <h3 class="font-bold text-lg mb-4">Restore Visit {{ visit.id }} of {{ visit.patient.fullname }}?</h3>
                <p class="label text-xs">This action will reactivate the visit record, making it available for new actions.</p>
                
                <div class="flex items-center gap-2 w-full mt-4">
                    <button
                        type="button"
                        class="btn btn-neutral text-white flex-1"
                        onclick="delete_visit_modal.close();"
                    >
                        Cancel
                    </button>
                    <button
                        type="submit"
                        class="btn btn-primary text-white flex-1"
                    >
                        Restore
                    </button>
                </div>
            </form>
        {% endif %}
    </div>
</dialog>
